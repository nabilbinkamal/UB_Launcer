name: Verify launcher
on: [push, pull_request]
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build UBLauncher.slnx -c Release
      - run: dotnet test Launcher.Tests/Launcher.Tests.csproj -c Release --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deployment/relay-security.test.cjs
